# Default public /v1 ingress contract. Exact large-context, embedding and audio
# routes are overridden by the release-managed server include.
client_max_body_size 1m;
client_body_timeout 10s;
limit_req zone=nf_v1_edge_v2 burst=2000 nodelay;
limit_conn nf_v1_edge_conn_v2 500;
limit_req_status 429;
limit_conn_status 429;
