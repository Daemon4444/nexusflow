images:
  backend:
    repository: ""
    digest: ""
  frontend:
    repository: ""
    digest: ""
  pullPolicy: IfNotPresent

runtime:
  existingSecret: nexusflow-runtime-secrets
  backendUrl: http://nexusflow-api:3001
  shutdownTimeoutMs: 540000

backend:
  replicas: 2
  eciSpecs: "0.5-1Gi,0.5-2Gi"
  computeCategory: "general,economy"
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 500m
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 65

frontend:
  replicas: 2
  eciSpecs: "0.25-0.5Gi,0.25-1Gi"
  computeCategory: "general,economy"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 250m
      memory: 512Mi

ingress:
  enabled: false
  className: alb
  host: nexusflow.hk
  albConfigName: ""

migrations:
  enabled: false

podAnnotations: {}
