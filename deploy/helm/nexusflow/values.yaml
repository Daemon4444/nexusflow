images:
  backend:
    repository: ""
    digest: ""
  frontend:
    repository: ""
    digest: ""
  gateway:
    repository: ""
    digest: ""
  pullPolicy: IfNotPresent

runtime:
  existingSecret: nexusflow-runtime-secrets
  backendUrl: http://nexusflow-api:3001
  shutdownTimeoutMs: 540000
  sseHeartbeatIntervalMs: 15000

backend:
  replicas: 2
  eciSpecs: "0.5-1Gi,0.5-2Gi"
  computeCategory: "general,economy"
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 500m
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 65
    inflight:
      enabled: false
      metricName: nexusflow_public_api_inflight_requests
      targetAverageValue: "20"

frontend:
  replicas: 2
  eciSpecs: "0.25-0.5Gi,0.25-1Gi"
  computeCategory: "general,economy"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 250m
      memory: 512Mi

gateway:
  replicas: 2
  existingAuthSecret: nexusflow-gateway-auth
  trustedProxyCidrs:
    - 172.27.0.0/16
  eciSpecs: "0.25-0.5Gi,0.25-1Gi"
  computeCategory: "general,economy"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 250m
      memory: 512Mi

ingress:
  enabled: false
  className: alb
  host: nexusflow.hk
  albConfigName: ""
  # Optional ALB listener mapping, for example: '[{"HTTP":18080}]'.
  # Keep empty to use the controller default.
  listenPorts: ""

migrations:
  enabled: false

podAnnotations: {}
