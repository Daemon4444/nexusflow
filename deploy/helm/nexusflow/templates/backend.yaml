apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexusflow-api
  labels:
    {{- include "nexusflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.backend.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nexusflow
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexusflow
        app.kubernetes.io/component: api
        alibabacloud.com/eci: "true"
      annotations:
        k8s.aliyun.com/eci-use-specs: {{ .Values.backend.eciSpecs | quote }}
        k8s.aliyun.com/eci-compute-category: {{ .Values.backend.computeCategory | quote }}
        prometheus.io/scrape: "true"
        prometheus.io/path: "/_internal/metrics"
        prometheus.io/port: "3001"
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: nexusflow-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 600
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: nexusflow
              app.kubernetes.io/component: api
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: {{ include "nexusflow.image" .Values.images.backend | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: NODE_ENV
              value: production
            - name: NEXUSFLOW_ENV
              value: production
            - name: NEXUSFLOW_RELEASE_RUNTIME
              value: "true"
            - name: NEXUSFLOW_CONTAINER_RUNTIME
              value: "true"
            - name: PORT
              value: "3001"
            - name: GRACEFUL_SHUTDOWN_TIMEOUT_MS
              value: {{ .Values.runtime.shutdownTimeoutMs | quote }}
            - name: SSE_HEARTBEAT_INTERVAL_MS
              value: {{ .Values.runtime.sseHeartbeatIntervalMs | quote }}
          envFrom:
            - secretRef:
                name: {{ .Values.runtime.existingSecret }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 2
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "kill -USR2 1; sleep 10"]
          volumeMounts:
            - name: uploads
              mountPath: /app/backend/uploads
            - name: tmp
              mountPath: /tmp
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: uploads
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nexusflow-api
  labels:
    {{- include "nexusflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: nexusflow
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 3001
      targetPort: http
  type: ClusterIP
