apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexusflow-gateway
  labels:
    {{- include "nexusflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nexusflow
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexusflow
        app.kubernetes.io/component: gateway
        alibabacloud.com/eci: "true"
      annotations:
        k8s.aliyun.com/eci-use-specs: {{ .Values.gateway.eciSpecs | quote }}
        k8s.aliyun.com/eci-compute-category: {{ .Values.gateway.computeCategory | quote }}
        # Hash the rendered gateway ConfigMap so any nginx config change —
        # template edit or values change — forces a zero-downtime rolling update.
        checksum/config: {{ include (print $.Template.BasePath "/gateway-config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: nexusflow-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 620
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: nexusflow
              app.kubernetes.io/component: gateway
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: {{ include "nexusflow.image" .Values.images.gateway | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /_gateway/health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /_gateway/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness must stay local to nginx. Probing the backend here would
          # pull every gateway Pod out of the Service on a brief RDS/Redis
          # blip and turn a partial API failure into a full-site outage.
          readinessProbe:
            httpGet:
              path: /_gateway/health
              port: http
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 2
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10; nginx -s quit"]
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: config
              mountPath: /etc/nginx/snippets
              readOnly: true
            - name: auth
              mountPath: /etc/nginx/auth
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: nexusflow-gateway
            items:
              - key: nginx.conf
                path: nginx.conf
              - key: nexusflow-api-proxy.conf
                path: nexusflow-api-proxy.conf
              - key: nexusflow-web-proxy.conf
                path: nexusflow-web-proxy.conf
              - key: nexusflow-large.conf
                path: nexusflow-large.conf
        - name: auth
          secret:
            secretName: {{ .Values.gateway.existingAuthSecret }}
            items:
              - key: .htpasswd
                path: .htpasswd
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nexusflow-gateway
  labels:
    {{- include "nexusflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  selector:
    app.kubernetes.io/name: nexusflow
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP
