{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexusflow-gateway
  labels:
    {{- include "nexusflow.labels" . | nindent 4 }}
  annotations:
    alb.ingress.kubernetes.io/albconfig: {{ .Values.ingress.albConfigName | quote }}
    {{- with .Values.ingress.listenPorts }}
    alb.ingress.kubernetes.io/listen-ports: {{ . | quote }}
    {{- end }}
    alb.ingress.kubernetes.io/healthcheck-enabled: "true"
    alb.ingress.kubernetes.io/healthcheck-path: /api/health/ready
    alb.ingress.kubernetes.io/healthcheck-method: GET
    alb.ingress.kubernetes.io/healthcheck-code: http_2xx
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "3"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "2"
    alb.ingress.kubernetes.io/connection-drain-enabled: "true"
    alb.ingress.kubernetes.io/connection-drain-timeout: "300"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexusflow-gateway
                port:
                  number: 8080
{{- end }}
