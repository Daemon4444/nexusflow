apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nexusflow-api
  labels:
    {{- include "nexusflow.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nexusflow
      app.kubernetes.io/component: api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nexusflow-web
  labels:
    {{- include "nexusflow.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nexusflow
      app.kubernetes.io/component: web
