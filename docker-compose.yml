version: '3.8'

services:
  # Redis - 用于速率限制、会话缓存
  redis:
    image: redis:7-alpine
    container_name: quadrant-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass f8a8b6e3c3985bdbc5421d476e1d18f7
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "f8a8b6e3c3985bdbc5421d476e1d18f7", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # PostgreSQL - 主数据库
  postgres:
    image: postgres:16-alpine
    container_name: quadrant-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: quadrant
      POSTGRES_PASSWORD: quadrant_dev_password
      POSTGRES_DB: quadrant
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quadrant -d quadrant"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local

networks:
  default:
    name: quadrant-network