name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# The former single "validate" job is split into independent parallel jobs so
# one failing area no longer hides the results of the others. The release CI
# gate (scripts/check-release-ci.sh) requires every job of this workflow to
# succeed.
jobs:
  security:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexusflow_ci
          POSTGRES_PASSWORD: nexusflow_ci
          POSTGRES_DB: nexusflow_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexusflow_ci -d nexusflow_ci_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
        env:
          # Redis integration tests request their pinned 7.2.7 binary at runtime.
          # Avoid compiling the unrelated moving "stable" Redis Stack in postinstall.
          REDISMS_DISABLE_POSTINSTALL: "true"
      - run: npm audit --omit=dev --audit-level=high
      - run: npm --workspace backend run test:large-json-auth
      - run: npm --workspace backend run test:request-body-admission
      - run: npm --workspace backend run test:auth-password-security
      - run: npm --workspace backend run test:auth-login-rate-limit
      - run: npm --workspace backend run test:health-compatibility
      - run: npm --workspace backend run test:runtime-safety
      - run: npm --workspace backend run test:session-token-security
      - run: npm --workspace backend run test:api-key-rate-limit-security
      - run: npm --workspace backend run test:outbound-url-policy
      - run: npm --workspace backend run test:audio-upload-security
      - run: npm --workspace backend run test:upload-security
      - run: npm --workspace backend run test:provider-secrets
      - run: npm --workspace backend run test:demo-admin
      - name: Migrate the CI database
        run: npm --workspace backend run db:migrate
        env:
          PG_HOST: 127.0.0.1
          PG_PORT: 5432
          PG_USER: nexusflow_ci
          PG_PASSWORD: nexusflow_ci
          PG_DATABASE: nexusflow_ci_test
      - run: npm --workspace backend run test:session-token-security:postgres
        env:
          PG_HOST: 127.0.0.1
          PG_PORT: 5432
          PG_USER: nexusflow_ci
          PG_PASSWORD: nexusflow_ci
          PG_DATABASE: nexusflow_ci_test
          NODE_ENV: test
          SESSION_TOKEN_SECURITY_INTEGRATION: "true"

  billing-routing:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexusflow_ci
          POSTGRES_PASSWORD: nexusflow_ci
          POSTGRES_DB: nexusflow_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexusflow_ci -d nexusflow_ci_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
        env:
          # Redis integration tests request their pinned 7.2.7 binary at runtime.
          # Avoid compiling the unrelated moving "stable" Redis Stack in postinstall.
          REDISMS_DISABLE_POSTINSTALL: "true"
      - run: npm --workspace backend run test:stream-reliability
      - run: npm --workspace backend run test:billing
      - run: npm --workspace backend run test:load-test-account
      - run: npm --workspace backend run test:model-catalog
      - run: npm --workspace backend run test:official-pricing
      - run: npm --workspace backend run test:media-contracts
      - run: npm --workspace backend run test:azure-provider-contract
      - run: npm --workspace backend run test:payment-settlement
      - run: npm --workspace backend run test:sub-account-rate-limits
      - run: npm --workspace backend run test:provider-monitor
      - run: npm --workspace backend run test:provider-cost-import
      - run: npm --workspace backend run test:managed-routing
      - run: npm --workspace backend run test:audio-pricing
      - run: npm --workspace backend run test:task-poll-control
      - run: npm --workspace backend run test:inference-characterization
      - run: npm --workspace backend run test:pipeline-stages
      - name: Migrate the CI database
        run: npm --workspace backend run db:migrate
        env:
          PG_HOST: 127.0.0.1
          PG_PORT: 5432
          PG_USER: nexusflow_ci
          PG_PASSWORD: nexusflow_ci
          PG_DATABASE: nexusflow_ci_test
      - run: npm --workspace backend run test:payment-settlement:postgres
        env:
          PG_HOST: 127.0.0.1
          PG_PORT: 5432
          PG_USER: nexusflow_ci
          PG_PASSWORD: nexusflow_ci
          PG_DATABASE: nexusflow_ci_test
          NODE_ENV: test
          PAYMENT_SETTLEMENT_INTEGRATION: "true"
      - run: npm --workspace backend run test:sub-account-concurrency:postgres
        env:
          PG_HOST: 127.0.0.1
          PG_PORT: 5432
          PG_USER: nexusflow_ci
          PG_PASSWORD: nexusflow_ci
          PG_DATABASE: nexusflow_ci_test
          NODE_ENV: test
      - run: npm --workspace backend run test:provider-capacity-redis
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379

  control-plane:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexusflow_ci
          POSTGRES_PASSWORD: nexusflow_ci
          POSTGRES_DB: nexusflow_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexusflow_ci -d nexusflow_ci_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
        env:
          # Redis integration tests request their pinned 7.2.7 binary at runtime.
          # Avoid compiling the unrelated moving "stable" Redis Stack in postinstall.
          REDISMS_DISABLE_POSTINSTALL: "true"
      - run: npm --workspace backend run test:admin-control-plane
      - run: npm --workspace backend run test:admin-audit-intents
      - run: npm --workspace backend run test:control-plane-persistence
      - run: npm --workspace backend run test:feature-flags
      - run: npm --workspace backend run test:notifier
      - run: npm --workspace backend run test:control-plane-consistency
      - run: npm --workspace backend run test:bailian-catalog
      - run: npm --workspace backend run test:control-plane-config
      - run: npm --workspace backend run test:traffic
      - run: npm --workspace backend run test:params-protocols
      - run: npm --workspace backend run test:cp-change-requests
      - name: Verify complete, idempotent and checksummed migration ledger
        run: node scripts/test-migration-ledger.mjs
        env:
          PG_HOST: 127.0.0.1
          PG_PORT: 5432
          PG_USER: nexusflow_ci
          PG_PASSWORD: nexusflow_ci
          PG_DATABASE: nexusflow_ci_test

  release-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Install release script checkers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nginx shellcheck
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
        env:
          # Redis integration tests request their pinned 7.2.7 binary at runtime.
          # Avoid compiling the unrelated moving "stable" Redis Stack in postinstall.
          REDISMS_DISABLE_POSTINSTALL: "true"
      - name: Validate release script syntax
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          for script in scripts/*.mjs; do node --check "$script"; done
          shellcheck -S warning -x scripts/*.sh
      - run: npm run test:release-telemetry
      - run: npm run test:release-telemetry-reconcile
      - run: npm run test:release-primitives
      - run: npm run test:provider-cost-release
      - run: npm run test:deploy-orchestrator-state
      - run: npm run test:release-ci-gate
      - run: npm run test:backup-freshness
      - run: npm run test:load-test
      - run: npm run test:docs-index

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
        env:
          # Redis integration tests request their pinned 7.2.7 binary at runtime.
          # Avoid compiling the unrelated moving "stable" Redis Stack in postinstall.
          REDISMS_DISABLE_POSTINSTALL: "true"
      - run: npm --workspace frontend run lint -- --quiet
      - run: npm run build:backend
      - run: npm run build:frontend
